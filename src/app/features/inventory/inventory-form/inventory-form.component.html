<div class="max-w-2xl space-y-6">
  <div class="flex items-center gap-3">
    <a routerLink="/inventory" class="text-slate-400 hover:text-slate-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>
    <h1 class="text-2xl font-bold text-slate-800">{{ isEdit ? 'Edit Material' : 'Add Raw Material' }}</h1>
  </div>

  <form (ngSubmit)="save()" class="bg-white rounded-xl shadow-sm p-6 space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Material Name</label>
        <input [(ngModel)]="form.name" name="name" required placeholder="e.g. Cowhide Leather"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
        <select [(ngModel)]="form.category" name="category"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
          <option value="">-- Select --</option>
          @for (c of categories; track c) { <option [value]="c">{{ c }}</option> }
        </select>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Quantity in Stock</label>
        <input type="number" [(ngModel)]="form.quantity" name="quantity" min="0" required
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Unit</label>
        <input [(ngModel)]="form.unit" name="unit" placeholder="e.g. metres, kg, litres"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Reorder Level</label>
        <input type="number" [(ngModel)]="form.reorder_level" name="reorder_level" min="0"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Supplier</label>
      <input [(ngModel)]="form.supplier" name="supplier" placeholder="Supplier name"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Notes</label>
      <textarea [(ngModel)]="form.notes" name="notes" rows="2"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 resize-none"></textarea>
    </div>

    @if (error) {
      <p class="text-red-500 text-sm bg-red-50 rounded-lg px-3 py-2">{{ error }}</p>
    }

    <div class="flex gap-3 pt-2">
      <button type="submit" [disabled]="loading()"
        class="bg-amber-500 hover:bg-amber-600 disabled:opacity-50 text-white font-medium px-6 py-2.5 rounded-lg transition-colors text-sm">
        {{ loading() ? 'Saving...' : (isEdit ? 'Update' : 'Add Material') }}
      </button>
      <a routerLink="/inventory"
        class="text-slate-600 font-medium px-6 py-2.5 rounded-lg border border-slate-300 hover:border-slate-400 transition-colors text-sm">
        Cancel
      </a>
    </div>
  </form>
</div>
