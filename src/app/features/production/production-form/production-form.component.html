<div class="max-w-2xl space-y-6">
  <div class="flex items-center gap-3">
    <a routerLink="/production" class="text-slate-400 hover:text-slate-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>
    <div>
      <h1 class="text-2xl font-bold text-slate-800">{{ isEdit ? 'Edit Batch' : 'New Production Batch' }}</h1>
    </div>
  </div>

  <form (ngSubmit)="save()" class="bg-white rounded-xl shadow-sm p-6 space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Batch Number</label>
        <input [(ngModel)]="form.batch_number" name="batch_number" required
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 font-mono" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
        <select [(ngModel)]="form.status" name="status"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
          @for (s of statuses; track s) {
            <option [value]="s">{{ s | titlecase }}</option>
          }
        </select>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Shoe Model</label>
        <input [(ngModel)]="form.shoe_model" name="shoe_model" required placeholder="e.g. Oxford Classic"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Shoe Type</label>
        <input [(ngModel)]="form.shoe_type" name="shoe_type" placeholder="e.g. Formal, Casual, Boot"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
      </div>
    </div>

    <div class="grid grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Quantity (pairs)</label>
        <input type="number" [(ngModel)]="form.quantity" name="quantity" min="1" required
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Size Range</label>
        <input [(ngModel)]="form.size_range" name="size_range" placeholder="e.g. 38-44"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Color</label>
        <input [(ngModel)]="form.color" name="color" placeholder="e.g. Black, Brown"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Assigned Worker</label>
      <select [(ngModel)]="form.assigned_to" name="assigned_to"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
        <option value="">-- Select worker --</option>
        @for (s of staff(); track s.id) {
          <option [value]="s.id">{{ s.full_name }}</option>
        }
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Notes</label>
      <textarea [(ngModel)]="form.notes" name="notes" rows="3" placeholder="Any additional notes..."
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 resize-none"></textarea>
    </div>

    @if (error) {
      <p class="text-red-500 text-sm bg-red-50 rounded-lg px-3 py-2">{{ error }}</p>
    }

    <div class="flex gap-3 pt-2">
      <button type="submit" [disabled]="loading()"
        class="bg-amber-500 hover:bg-amber-600 disabled:opacity-50 text-white font-medium px-6 py-2.5 rounded-lg transition-colors text-sm">
        {{ loading() ? 'Saving...' : (isEdit ? 'Update Batch' : 'Create Batch') }}
      </button>
      <a routerLink="/production"
        class="text-slate-600 hover:text-slate-800 font-medium px-6 py-2.5 rounded-lg border border-slate-300 hover:border-slate-400 transition-colors text-sm">
        Cancel
      </a>
    </div>
  </form>
</div>
